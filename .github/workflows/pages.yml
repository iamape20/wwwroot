# Static site on GitHub Pages (2026-11-05): Vercel paused the site until 5 Dec
# for CPU (Hobby fair use). The home computer builds every page's data into
# public/data/ (js/buildStaticSite.js in the root project) and pushes; this
# publishes public/ as it stands. Nothing runs on the host per visitor.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a publish still waiting; one already running finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # 23-24 Nov 2026: 7 of 40 publishes failed here with "No artifacts named
      # github-pages were found" - GitHub had not yet registered the artifact
      # uploaded seconds before (the next publish always worked). Wait and
      # retry once instead of failing.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
