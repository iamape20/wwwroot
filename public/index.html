<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Elite Power Ratings</title>

    <link rel="stylesheet" href="css/app.css">

    <script type="module" src="js/app.js"></script>

</head>

<body>

<header class="topbar">

    <div class="brand">
        <img src="images/crest.jpg"
             alt="Elite Power Ratings"
             class="brand-logo" style="width:80px;">

        <div class="brand-text">
            <h1>Elite Power Ratings</h1>
            <span>Professional Racing Intelligence</span>
        </div>
    </div>

    <nav class="navigation">
        <a href="/">Dashboard</a>
        <a href="#">Meetings</a>
        <a href="#">Results</a>
        <a href="#">Statistics</a>
    </nav>

    <div class="topbar-right">
        <div id="clock"></div>
    </div>

</header>

<main class="wrapper">

    <!-- Hero -->

    <section id="hero">
        <div class="hero-card">
            <div class="hero-left">
                <span class="hero-badge">
                    ⭐ TODAY'S BEST OPPORTUNITY
                </span>

					<div class="hero-selection">

						<img
							id="bestSilk"
							class="hero-silk"
							src=""
							alt=""
						/>

						<div>

							<h2 id="bestHorse">Loading...</h2>

							<div id="bestRating" class="hero-rating"></div>

							<div id="bestConfidence" class="hero-confidence"></div>

							<div class="hero-location">
								<span id="bestCourse"></span>
								<span class="hero-dot">•</span>
								<span id="bestRaceTime"></span>
							</div>

						</div>

					</div>                
				
				<button class="primary-btn">
                    View Analysis →
                </button>
            </div>
        </div>
    </section>

    <!-- Meetings -->

    <section>

        <h2>Today's Meetings</h2>

        <div id="meetings"></div>

		<section id="racesSection">

			<h2 id="meetingTitle">Select a Meeting</h2>

			<div id="races"></div>

		</section>
		
		<section id="analysisSection">

			<h2 id="raceTitle">Elite Power Ratings</h2>

			<div id="analysis"></div>

		</section>
		
		

    </section>
	


</main>

<footer>

    <h4 style="padding-left:20px">
        Elite Power Ratings © 2026
    </h4>

</footer>

</body>

</html>
