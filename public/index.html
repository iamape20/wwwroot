<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Elite Power Ratings — data-driven horse racing ratings, race analysis and performance intelligence.">
	  
    <title>Elite Power Ratings</title>

    <link rel="stylesheet" href="css/app.css">
	<link rel="icon" href="images/crest.jpg" type="image/jpeg">

    <script src="js/clock.js"></script>
    <script type="module" src="js/app.js"></script>

</head>

<body>

<header class="topbar">

    <div class="brand">
	<img src="images/crest.jpg"
		 alt="Elite Power Ratings"
		 class="brand-logo"
		 width="80"
		 height="80">

        <div class="brand-text">
            <h1>Elite Power Ratings</h1>
            <span>Professional Racing Intelligence</span>
        </div>
    </div>

    <nav class="navigation">

    </nav>

    <div class="topbar-right">
        <div id="live-day" class="topbar-day"></div>
		<div id="live-clock" class="topbar-clock"></div>
        <div id="next-race-countdown" class="topbar-countdown"></div>
    </div>

</header>

<main class="wrapper">

    <!-- Top strip: today's meetings (wraps as needed) + NAP on the left,
         best-opportunity badge on the right. Stacks to a single column
         on mobile via CSS. -->

    <section id="hero">
        <div class="top-strip">

        <div class="top-strip-left">
            <span class="top-strip-label">Today's Meetings</span>
            <div id="meetings"></div>
            <div id="napCallout" class="nap-callout"></div>
        </div>

        <div id="heroBadge" class="hero-badge-compact">

            <img
                id="bestSilk"
                class="hero-badge-silk"
                src=""
                alt=""
            />

            <div class="hero-badge-text">

                <span class="hero-badge-label">Best Opportunity</span>

                <div class="hero-badge-name" id="bestHorse"></div>

                <div class="hero-badge-row">
                    <span id="bestRating" class="hero-rating"></span>
                    <span id="bestConfidence" class="hero-confidence"></span>
                </div>

                <div class="hero-badge-location">
                    <span id="bestCourse"></span>
                    <span class="hero-dot"></span>
                    <span id="bestRaceTime"></span>
                </div>

            </div>

            <span class="hero-badge-arrow">→</span>

        </div>

        </div>
    </section>

    <div id="todaysResultsStrip" class="results-strip" style="display:none;"></div>

    <!-- Meetings now live in the top strip above -->

    <section>

		<section id="racesSection">

			<h2 id="meetingTitle"></h2>

			<div id="races"></div>

		</section>
		
		<section id="analysisSection">

			<h2 id="raceTitle">Elite Power Ratings</h2>

			<div id="raceInfoBanner" class="race-info-banner"></div>

			<div id="analysis"></div>

		</section>
		
		

    </section>
	


</main>

<footer>
    <p style="padding-left:20px">
        Elite Power Ratings © 2026
    </p>
</footer>

</body>

</html>
