<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Elite Power Ratings — data-driven horse racing ratings, race analysis and performance intelligence.">

    <!-- Sets data-theme before first paint so there's no flash of the
         wrong theme - must run synchronously here, not as a deferred
         or module script, since those only run after the page has
         already started rendering with whatever the CSS defaults to. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("epr-theme");
                var theme = saved === "light" || saved === "dark"
                    ? saved
                    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <title>Elite Power Ratings</title>

    <!-- ?v= cache-busts CSS/JS on the browser and any CDN in front -
         there's no build step here to hash filenames automatically,
         and this project has no vercel.json setting explicit
         Cache-Control headers, so a changed file at the SAME url can
         silently keep being served from cache after a deploy (caught
         live 2026-09-25 - the theme-toggle CSS fix wasn't showing for
         a real visitor). Bump this date on every deploy that touches
         app.css or any of the ES module chain below (app.js ->
         pages/dashboard.js -> services/api.js) - each of those files'
         own import statement needs the SAME ?v= too, since the
         browser's module cache treats a different query string as a
         different module and busting the entry point alone does not
         bust what it imports. -->
    <link rel="stylesheet" href="css/app.css?v=20260926e">
	<link rel="icon" href="images/crest.jpg" type="image/jpeg">

    <script src="js/clock.js?v=20260925" defer></script>
    <script src="js/theme.js?v=20260925" defer></script>
    <script type="module" src="js/app.js?v=20260926c"></script>

</head>

<body>

<header class="topbar">

    <div class="brand">
	<img src="images/crest.jpg"
		 alt="Elite Power Ratings"
		 class="brand-logo"
		 width="80"
		 height="80">

        <div class="brand-text">
            <h1>Elite Power Ratings</h1>
            <span>Professional Racing Intelligence</span>
			<!-- <a href="/how-to-read.html" class="how-to-read-link">How to read this page</a> -->
        </div>
    </div>

	<div id="meetings" class="header-meetings"></div>

	<div class="topbar-right">
		<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">🌙</button>
		<div id="live-day" class="topbar-day"></div>
		<div id="live-clock" class="topbar-clock"></div>
		<div id="next-race-countdown" class="topbar-countdown"></div>
	</div>

</header>

<main class="wrapper">

    <!-- Top strip: left column is the selected meeting's races + race
         info; right column is the best-opportunity badge and today's
         picks, tier-sorted into one list. Stacks to a single column
         on mobile via CSS. -->

    <section id="hero">
        <div class="top-strip">

        <div class="top-strip-left">

            <section id="racesSection">

                <h2 id="meetingTitle"></h2>

                <div id="races"></div>

            </section>

        </div>

        <div class="top-strip-right">

            <section id="pickBoard" class="pick-board" aria-label="Today's betting candidates">
                <div id="napCallout" class="nap-callout"></div>
                <div id="dailyDoubleBox"></div>
                <div id="pick-board-list" class="pick-board-list"></div>
                <div id="dailyDoubleYesterday"></div>
            </section>

        </div>

        </div>
    </section>

    <div id="todaysResultsStrip" class="results-strip" style="display:none;"></div>

    <section>

		<section id="analysisSection">
		
			<div id="raceInfoBanner" class="race-info-banner"></div>
			
			<h2 id="raceTitle">Select a race to see full analysis</h2>

			<div id="analysis"></div>

		</section>
		
		

    </section>
	

</main>

<footer>
    <p style="padding-left:20px">
        Elite Power Ratings © 2026
    </p>
</footer>

</body>

</html>
