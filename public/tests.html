<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Elite Power Ratings — data-driven horse racing ratings, race analysis and performance intelligence.">

    <!-- Sets data-theme before first paint so there's no flash of the
         wrong theme - must run synchronously here, not as a deferred
         or module script, since those only run after the page has
         already started rendering with whatever the CSS defaults to. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("epr-theme");
                var theme = saved === "light" || saved === "dark"
                    ? saved
                    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <title>Paper Tests</title>
    <link rel="stylesheet" href="css/app.css?v=20261106d">
    <link rel="icon" href="images/crest.jpg" type="image/jpeg">
    <script src="js/theme.js?v=20260925" defer></script>
    <style>
        body { background: var(--epr-bg, #0b0f17); }
        .tests-page { max-width: 820px; margin: 0 auto; padding: 16px; }
        .tests-page h1 { font-size: 1.3rem; margin: 6px 0 4px; color: var(--epr-text); }
        .tests-page .rule-test { margin: 18px 0; font-size: 13px; }
        .tests-intro { color: var(--epr-muted); font-size: 13px; }
        .tests-intro a { color: var(--epr-gold); }
    </style>
</head>
<body>
<main class="tests-page">
    <h1>Paper tests</h1>
    <div class="tests-intro">Three ways of betting on trial with no money, each with its pass mark set before the first bet.
        Real-money bets stay paused until one passes. <span id="testsUpdated"></span> &middot; <a href="index.html">Back to the card</a></div>
    <div id="ruleTestBlock" class="rule-test" style="display:none;"></div>
    <div id="extraPlacesBlock" class="rule-test" style="display:none;"></div>
    <div id="bogBlock" class="rule-test" style="display:none;"></div>
</main>
<script type="module">
    import { loadTests } from "./js/pages/testPanels.js?v=20261106a";
    loadTests();
    setInterval(loadTests, 120000);
</script>
</body>
</html>
