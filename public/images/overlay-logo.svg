<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Overlay">
  <title>Overlay</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18294f"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3DC85"/>
      <stop offset="1" stop-color="#C79F2B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- horseshoe, opening upward (the lucky way) -->
  <path d="M17 13 L17 33 A15 15 0 0 0 47 33 L47 13" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
  <rect x="12.5" y="9.5" width="9" height="5" rx="1.5" fill="#F3DC85"/>
  <rect x="42.5" y="9.5" width="9" height="5" rx="1.5" fill="#F3DC85"/>
  <g fill="#0a1226">
    <circle cx="17" cy="20.5" r="1.6"/><circle cx="17" cy="29.5" r="1.6"/><circle cx="20.2" cy="40.5" r="1.6"/>
    <circle cx="47" cy="20.5" r="1.6"/><circle cx="47" cy="29.5" r="1.6"/><circle cx="43.8" cy="40.5" r="1.6"/>
  </g>
  <!-- rising price line: a price bigger than the chance -->
  <path d="M25 37.5 L30 31.5 L34 34.5 L40 25" fill="none" stroke="#F3DC85" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35.6 24.2 L40.6 23.8 L41 28.8" fill="none" stroke="#F3DC85" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
