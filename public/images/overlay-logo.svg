<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Overlay">
  <title>Overlay</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18294f"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3DC85"/>
      <stop offset="1" stop-color="#C79F2B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- the price line rises behind the horse and breaks out top-right: a price bigger than the chance -->
  <path d="M8 49 L54 9" stroke="#F3DC85" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M46.5 8.6 L55 8 L54.4 16.5" fill="none" stroke="#F3DC85" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- horse head, facing left; navy outline separates it from the line behind -->
  <path d="M26 57 C26 48 28.5 42 32.5 38 C28.5 38.6 24.5 38 21 36.8 L16.5 35.2 C13.8 34.3 12.6 31.6 13.8 29.2 L21.5 18.6 C24 15.4 27.6 13.6 31.6 13 L34 8.4 L36.6 12.6 L39.2 8.8 L40.8 13.9 C46.4 16.6 49.6 22.2 49.2 29.2 C48.8 36.5 50.2 46.5 52.2 57 Z"
        fill="url(#gold)" stroke="#0a1226" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="29.6" cy="20.2" r="1.8" fill="#0a1226"/>
  <path d="M16.4 30.2 L18.6 29.6" stroke="#0a1226" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M41.4 15.2 C45.6 18.8 47.6 24 47.1 30.5" fill="none" stroke="#0a1226" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
</svg>
